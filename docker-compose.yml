version: '3.9'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Canonical defaults for local bring-up. Override via root .env as needed.
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-your_mysql_password}
      MYSQL_DATABASE: ${DB_NAME:-asset_management_dev}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-your_mysql_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-asset_management_dev}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-your_mysql_password}
    ports:
      - "5000:5000"
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-side API base URL
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    driver: bridge
